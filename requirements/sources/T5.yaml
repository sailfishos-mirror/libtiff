    description: >
      32-bit flag field describing CCITT Group 3 facsimile coding options, used with
      Compression=3.
    values:
      0: "Bit 0: 1 = 2-dimensional coding (else 1-dimensional)"
      1: "Bit 1: 1 = uncompressed mode used"
      2: "Bit 2: 1 = fill bits added before EOL so EOL ends on a byte boundary"
    interacts_with: [259, 278]

  - code: 293
    hex: "0x0125"
    name: Group4Options
    types: [LONG]
    count: "1"
    default: 0
    required: conditional
    conformance: extension
    section: "3"
    description: >
      32-bit flag field describing CCITT Group 4 facsimile coding options, used with
      Compression=4.
    values:
      0: "Bit 0: unused"
      1: "Bit 1: 1 = uncompressed mode used"
    interacts_with: [259]

  - code: 296
    hex: "0x0128"
    name: ResolutionUnit
    types: [SHORT]
    count: "1"
    default: 2
    required: yes
    conformance: baseline
    section: "3"
    description: Unit for XResolution and YResolution values.
    values:
      1: "No absolute unit of measurement"
      2: "Inch (default)"
      3: "Centimeter"
    interacts_with: [282, 283]

  - code: 297
    hex: "0x0129"
    name: PageNumber
    types: [SHORT]
    count: "2"
    default: null
    required: no
    conformance: extension
    section: "3"
    description: >
      Page number of a multi-page (e.g. facsimile) document; first value = page number
      (0-based, pages need not be in numerical order), second value = total pages.
    interacts_with: [254]

  - code: 301
    hex: "0x012D"
    name: ColorResponseCurves
    types: [SHORT]
    count: "3 * (2**BitsPerSample)"
    default: "curves based on NTSC recommended gamma of 2.2"
    required: no
    conformance: extension
    section: "3"
    description: >
      Three concatenated Red/Green/Blue lookup-table curves (each of length 2**BitsPerSample)
      refining the color balance of an RGB image, expressing "gamma" so a reader can
      compensate for source vs destination gamma difference. Recommended (not required) for
      TIFF Class R.
    interacts_with: [258, 320]

  - code: 305
    hex: "0x0131"
    name: Software
    types: [ASCII]
    count: "variable (string length incl. null)"
    default: null
    required: no
    conformance: extension
    section: "3"
    description: Name and release number of the software package that created the image.
    interacts_with: [271, 272]

  - code: 306
    hex: "0x0132"
    name: DateTime
    types: [ASCII]
    count: "20"
    default: null
    required: no
    conformance: extension
    section: "3"
    description: >
      Date and time of image creation, format "YYYY:MM:DD HH:MM:SS" (24-hour clock, one space
      separator), 20 bytes including terminating null.

  - code: 315
    hex: "0x013B"
    name: Artist
    types: [ASCII]
    count: "variable (string length incl. null)"
    default: null
    required: no
    conformance: extension
    section: "3"
    description: >
      Person who created the image; also suggested as the place to attach a copyright notice.

  - code: 316
    hex: "0x013C"
    name: HostComputer
    types: [ASCII]
    count: "variable (string length incl. null)"
    default: null
    required: no
    conformance: extension
    section: "3"
    description: The computer and/or operating system used to create the image (e.g. "ENIAC").
    interacts_with: [271, 272, 305]

  - code: 317
    hex: "0x013D"
    name: Predictor
    types: [SHORT]
    count: "1"
    default: 1
    required: conditional
    conformance: extension
    section: "3"
    description: >
      Predictor (mathematical operator) applied to image data before encoding; used only
      with Compression=5 (LZW) as of Revision 5.0. Value 2 (horizontal differencing) is a
      post-5.0 draft addendum (Appendix I), not part of the officially released 5.0 body.
    values:
      1: "No prediction scheme used before coding (default)"
      2: "Horizontal differencing (Appendix I draft addendum; not in the released 5.0 main body)"
    interacts_with: [259, 284, 258, 277]

  - code: 318
    hex: "0x013E"
    name: WhitePoint
    types: [RATIONAL]
    count: "2"
    default: "D65: x=0.313, y=0.329"
    required: no
    conformance: extension
    section: "Appendix H"
    description: >
      Chromaticity (CIE 1931 xyY, x then y) of the image's white point; luminance
      unspecified. Recommended (not required) for TIFF Class R. Added in Revision 5.0
      (Appendix H).
    interacts_with: [319, 301]
    notes: >
      Appendix J (a separate, unadopted post-5.0 draft) proposes a different tag also
      numbered 318 named ColorImageType; that proposal was apparently never assigned this
      number in practice. See requirement T5-129.

  - code: 319
    hex: "0x013F"
    name: PrimaryChromaticities
    types: [RATIONAL]
    count: "6"
    default: "SMPTE: Red(0.635,0.340) Green(0.305,0.595) Blue(0.155,0.070)"
    required: no
    conformance: extension
    section: "Appendix H"
    description: >
      Chromaticities (CIE 1931 xyY) of the red, green, and blue primaries, ordered red-x,
      red-y, green-x, green-y, blue-x, blue-y. Recommended (not required) for TIFF Class R.
      Added in Revision 5.0 (Appendix H).
    interacts_with: [318, 301]
    notes: >
      Appendix J (a separate, unadopted post-5.0 draft) proposes a different tag also
      numbered 319 named ColorList; that proposal was apparently never assigned this number in
      practice. See requirement T5-130.

  - code: 320
    hex: "0x0140"
    name: ColorMap
    types: [SHORT]
    count: "3 * (2**BitsPerSample)"
    default: null
    required: conditional
    conformance: baseline
    section: "3"
    description: >
      Red-Green-Blue color map (palette) for palette color images; three concatenated
      subcurves (R, G, B), each of length 2**BitsPerSample, 0=min intensity, 65535=max
      intensity. Required whenever PhotometricInterpretation=3 (TIFF Class P).
    interacts_with: [258, 262, 301]

  - code: 318
    hex: "0x013E"
    name: ColorImageType
    types: [SHORT]
    count: "1"
    default: 1
    required: no
    conformance: extension
    section: "Appendix J"
    description: >
      PROPOSED (unadopted, post-5.0 draft, Appendix J) tag classifying a color image as
      continuous-tone/natural or synthetic/restricted-palette. Not required for TIFF Class R.
      NOTE: proposed tag number collides with the officially added WhitePoint(318) tag from
      Appendix H; see T5-129.
    values:
      1: "Continuous tone, natural image (default)"
      2: "Synthetic image using a greatly restricted range of colors (see proposed ColorList)"
    interacts_with: [319]

  - code: 319
    hex: "0x013F"
    name: ColorList
    types: [BYTE, SHORT]
    count: "(number of colors used) * SamplesPerPixel"
    default: null
    required: no
    conformance: extension
    section: "Appendix J"
    description: >
      PROPOSED (unadopted, post-5.0 draft, Appendix J) unordered array of RGB triplets
      enumerating colors used in an image with ColorImageType=2. NOTE: proposed tag number
      collides with the officially added PrimaryChromaticities(319) tag from Appendix H; see
      T5-130.
    interacts_with: [318, 277]

dependencies:
  - id: T5-DEP-001
    requirement: T5-027
    when: "Compression(259) == 2"
    then: "BitsPerSample(258) must == 1"
    kind: requires
    tags: [259, 258]

  - id: T5-DEP-002
    requirement: T5-044
    when: "PhotometricInterpretation(262) == 3"
    then: "SamplesPerPixel(277) must == 1; ColorMap(320) must be present"
    kind: requires
    tags: [262, 277, 320]

  - id: T5-DEP-003
    requirement: T5-045
    when: "PhotometricInterpretation(262) == 4"
    then: >
      SamplesPerPixel(277) must == 1; BitsPerSample(258) must == 1; ImageLength(257) and
      ImageWidth(256) must equal those of the main image being masked
    kind: requires
    tags: [262, 277, 258, 257, 256]

  - id: T5-DEP-004
    requirement: T5-040
    when: "NewSubfileType(254) bit 2 == 1"
    then: "PhotometricInterpretation(262) must == 4"
    kind: requires
    tags: [254, 262]

  - id: T5-DEP-005
    requirement: T5-037
    when: "GrayResponseCurve(291) is present"
    then: "its values override PhotometricInterpretation(262) for interpretation purposes"
    kind: modifies-meaning
    tags: [291, 262]

  - id: T5-DEP-006
    requirement: T5-023
    when: "always (ColorMap(320) present)"
    then: "Count of ColorMap(320) == 3 * 2**BitsPerSample(258)"
    kind: constrains-value
    tags: [320, 258]

  - id: T5-DEP-007
    requirement: T5-024
    when: "always (ColorResponseCurves(301) present)"
    then: "Count of ColorResponseCurves(301) == 3 * 2**BitsPerSample(258)"
    kind: constrains-value
    tags: [301, 258]

  - id: T5-DEP-008
    requirement: T5-034
    when: "always (GrayResponseCurve(291) present)"
    then: "Count of GrayResponseCurve(291) == 2**BitsPerSample(258)"
    kind: constrains-value
    tags: [291, 258]

  - id: T5-DEP-009
    requirement: T5-021
    when: "always"
    then: "Count of BitsPerSample(258) == SamplesPerPixel(277)"
    kind: constrains-value
    tags: [258, 277]

  - id: T5-DEP-010
    requirement: T5-056
    when: "PlanarConfiguration(284) == 1"
    then: "Count of StripOffsets(273) and StripByteCounts(279) == StripsPerImage"
    kind: constrains-value
    tags: [284, 273, 279]

  - id: T5-DEP-011
    requirement: T5-056
    when: "PlanarConfiguration(284) == 2"
    then: "Count of StripOffsets(273) and StripByteCounts(279) == SamplesPerPixel(277) * StripsPerImage"
    kind: constrains-value
    tags: [284, 273, 279, 277]

  - id: T5-DEP-012
    requirement: T5-072
    when: "MaxSampleValue(281) is absent"
    then: "default value == 2**BitsPerSample(258) - 1"
    kind: selects-default
    tags: [281, 258]

  - id: T5-DEP-013
    requirement: T5-072
    when: "always"
    then: "Count of MinSampleValue(280) and MaxSampleValue(281) == SamplesPerPixel(277)"
    kind: constrains-value
    tags: [280, 281, 277]

  - id: T5-DEP-014
    requirement: T5-049
    when: "SamplesPerPixel(277) == 1"
    then: "PlanarConfiguration(284) is irrelevant and should not be written"
    kind: modifies-meaning
    tags: [277, 284]

  - id: T5-DEP-015
    requirement: T5-052
    when: "always"
    then: "StripsPerImage == ceil(ImageLength(257) / RowsPerStrip(278))"
    kind: constrains-value
    tags: [257, 278]

  - id: T5-DEP-016
    requirement: T5-050
    when: "Compression(259) != 5"
    then: "Predictor(317) is not applicable / meaningless in the main-body scheme (only defined value 1 exists)"
    kind: constrains-value
    tags: [259, 317]

  - id: T5-DEP-017
    requirement: T5-069
    when: "always (CellLength(265) present)"
    then: "Threshholding(263) is assumed to == 2"
    kind: constrains-value
    tags: [265, 263]

  - id: T5-DEP-018
    requirement: T5-029
    when: "Compression(259) == 3"
    then: "Group3Options(292) applies and governs 1D/2D coding, uncompressed mode, and fill-bit behavior"
    kind: constrains-value
    tags: [259, 292]

  - id: T5-DEP-019
    requirement: T5-030
    when: "Compression(259) == 4"
    then: "Group4Options(293) applies and governs uncompressed mode and strip encoding behavior"
    kind: constrains-value
    tags: [259, 293]

  - id: T5-DEP-020
    requirement: T5-102
    when: "Compression(259) == 5"
    then: >
      reader must inspect Predictor(317); if Predictor == 1 decompression proceeds normally;
      if Predictor != 1 and unrecognized, reader should give up
    kind: requires
    tags: [259, 317]

  - id: T5-DEP-021
    requirement: T5-127
    when: "Predictor(317) == 2 (Appendix I draft) and PlanarConfiguration(284) == 1"
    then: >
      horizontal differencing must use an offset of SamplesPerPixel(277) (same-channel
      differencing) and BitsPerSample(258) must be identical for all samples
    kind: constrains-value
    tags: [317, 284, 277, 258]

  - id: T5-DEP-022
    requirement: T5-026
    when: "Compression(259) == 1"
    then: >
      bytes per row == ceil(ImageWidth(256) * SamplesPerPixel(277) * BitsPerSample(258) / 8)
      if PlanarConfiguration(284) == 1, else ceil(ImageWidth(256) * BitsPerSample(258) / 8)
    kind: constrains-value
    tags: [259, 256, 277, 258, 284]

  - id: T5-DEP-023
    requirement: T5-115
    when: "conformance class == TIFF Class B"
    then: >
      SamplesPerPixel(277)=1, BitsPerSample(258)=1, Compression(259) in [1,2,32773],
      PhotometricInterpretation(262) in [0,1]
    kind: constrains-value
    tags: [277, 258, 259, 262]

  - id: T5-DEP-024
    requirement: T5-116
    when: "conformance class == TIFF Class G"
    then: >
      SamplesPerPixel(277)=1, BitsPerSample(258) in [4,8], Compression(259) in [1,5],
      PhotometricInterpretation(262) in [0,1]
    kind: constrains-value
    tags: [277, 258, 259, 262]

  - id: T5-DEP-025
    requirement: T5-117
    when: "conformance class == TIFF Class P"
    then: >
      SamplesPerPixel(277)=1, BitsPerSample(258) in [1..8], Compression(259) in [1,5],
      PhotometricInterpretation(262)=3, ColorMap(320) present
    kind: constrains-value
    tags: [277, 258, 259, 262, 320]

  - id: T5-DEP-026
    requirement: T5-118
    when: "conformance class == TIFF Class R"
    then: >
      SamplesPerPixel(277)=3, BitsPerSample(258)=8,8,8, PlanarConfiguration(284) in [1,2],
      Compression(259) in [1,5], PhotometricInterpretation(262)=2
    kind: constrains-value
    tags: [277, 258, 284, 259, 262]

  - id: T5-DEP-027
    requirement: T5-040
    when: "NewSubfileType(254) bit 1 == 1"
    then: "the image is a single page of a multi-page image; see PageNumber(297)"
    kind: modifies-meaning
    tags: [254, 297]
