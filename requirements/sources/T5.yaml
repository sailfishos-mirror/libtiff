    description: >
      Precision/units of GrayResponseCurve values, expressed as a power-of-ten fraction of a
      unit of optical density.
    values:
      1: "Tenths of a unit"
      2: "Hundredths of a unit (default)"
      3: "Thousandths of a unit (recommended for greater accuracy)"
      4: "Ten-thousandths of a unit"
      5: "Hundred-thousandths of a unit"
    interacts_with: [291]

  - code: 291
