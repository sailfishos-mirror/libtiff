    required: conditional
    conformance: extension
    section: "22"
    page: 104
    description: >
      JPEG process used. Mandatory whenever Compression is JPEG (no default).
    values:
      1: "Baseline sequential process"
      14: "Lossless process with Huffman coding"
    interacts_with: [259, 517, 518, 519, 520, 521]

  - code: 513
    hex: "0x0201"
    name: JPEGInterchangeFormat
    types: [LONG]
    count: "1"
    default: null
    required: no
    conformance: extension
    section: "22"
    page: 105
    description: >
      If non-zero, points to the SOI marker of a JPEG interchange-format bitstream in the file;
      zero or absent means none present.
    interacts_with: [514, 322, 323]

  - code: 514
    hex: "0x0202"
    name: JPEGInterchangeFormatLength
    types: [LONG]
    count: "1"
    default: null
    required: no
    conformance: extension
    section: "22"
    page: 105
    description: >
      Length in bytes of the JPEG interchange-format bitstream. Relevant only if
      JPEGInterchangeFormat is present and non-zero.
    interacts_with: [513]

  - code: 515
    hex: "0x0203"
    name: JPEGRestartInterval
    types: [SHORT]
    count: "1"
    default: null
    required: no
    conformance: extension
    section: "22"
    page: 105
    description: >
      Number of MCUs between restart markers. Zero or absent means no restart markers in the
      compressed data.
    interacts_with: [273, 324]

  - code: 517
    hex: "0x0205"
    name: JPEGLosslessPredictors
    types: [SHORT]
    count: "SamplesPerPixel"
    default: null
    required: conditional
    conformance: extension
    section: "22"
    page: 106
    description: >
      Lossless predictor-selection value per component (1..7). Mandatory whenever JPEGProc
      specifies a lossless process (no default).
    values:
      1: "A (left)"
      2: "B (above)"
      3: "C (diagonal left-above)"
      4: "A+B-C"
      5: "A+((B-C)/2)"
      6: "B+((A-C)/2)"
      7: "(A+B)/2"
    interacts_with: [512, 518]

  - code: 518
    hex: "0x0206"
    name: JPEGPointTransforms
    types: [SHORT]
    count: "SamplesPerPixel"
    default: 0
    required: no
    conformance: extension
    section: "22"
    page: 106
    description: >
      Point-transform value per component (lossless only). Nonzero divides input by 2**Pt
      before coding; decoder rescales by 2**Pt. Default 0 (no scaling).
    interacts_with: [512, 517]

  - code: 519
    hex: "0x0207"
    name: JPEGQTables
    types: [LONG]
    count: "SamplesPerPixel"
    default: null
    required: conditional
    conformance: extension
    section: "22"
    page: 107
    description: >
      Offsets to quantization tables, one per component; each table is 64 BYTES in zigzag
      order. Mandatory for DCT-based processes (no default).
    interacts_with: [512]

  - code: 520
    hex: "0x0208"
    name: JPEGDCTables
    types: [LONG]
    count: "SamplesPerPixel"
    default: null
    required: conditional
    conformance: extension
    section: "22"
    page: 107
    description: >
      Offsets to DC (or lossless) Huffman tables, one per component; each table is 16 BYTES of
      BITS plus up to 17 BYTES of VALUES. Mandatory for all JPEG processes (no default).
    interacts_with: [512]

  - code: 521
    hex: "0x0209"
    name: JPEGACTables
    types: [LONG]
    count: "SamplesPerPixel"
    default: null
    required: conditional
    conformance: extension
    section: "22"
    page: 107
    description: >
      Offsets to AC Huffman tables, one per component; each table is 16 BYTES of BITS plus up
      to 256 BYTES of VALUES. Mandatory for DCT-based processes (no default).
    interacts_with: [512]

  - code: 529
    hex: "0x0211"
    name: YCbCrCoefficients
    types: [RATIONAL]
    count: "3"
    default: "299/1000, 587/1000, 114/1000 (CCIR 601-1)"
    required: no
    conformance: extension
    section: "21"
    page: 90
    description: >
      RGB-to-YCbCr luminance coefficients LumaRed, LumaGreen, LumaBlue used to compute Y.
    interacts_with: [262, 532]

  - code: 530
    hex: "0x0212"
    name: YCbCrSubSampling
    types: [SHORT]
    count: "2"
    default: "[2, 2]"
    required: no
    conformance: extension
    section: "21"
    page: 91
    description: >
      Chrominance subsampling factors: Short 0 = YCbCrSubsampleHoriz, Short 1 =
      YCbCrSubsampleVert (each 1, 2, or 4). SubsampleVert must be <= SubsampleHoriz.
    values:
      1: "chroma dimension equal to luma dimension"
      2: "chroma dimension half of luma dimension"
      4: "chroma dimension one-quarter of luma dimension"
    interacts_with: [262, 256, 257, 322, 323, 278]

  - code: 531
    hex: "0x0213"
    name: YCbCrPositioning
    types: [SHORT]
    count: "1"
    default: 1
    required: no
    conformance: extension
    section: "21"
    page: 92
    description: >
      Positioning of subsampled chrominance samples relative to luminance samples.
    values:
      1: "centered (for PostScript Level 2, QuickTime compatibility)"
      2: "cosited (for CCIR 601-1 and most digital video)"
    interacts_with: [262, 530]

  - code: 532
    hex: "0x0214"
    name: ReferenceBlackWhite
    types: [RATIONAL, LONG]
    count: "6 (2*SamplesPerPixel)"
    default: "[0, NV, 0, NV, 0, NV] where NV = 2**BitsPerSample - 1"
    required: conditional
    conformance: extension
    section: "20, 21"
    page: 86
    description: >
      Headroom/footroom code pairs (ReferenceBlack, ReferenceWhite) per component, ordered as
      PhotometricInterpretation components. Applies to RGB and YCbCr only. Required (and must be
      explicit) for YCbCr images.
    interacts_with: [262, 258, 529, 301, 342]
    notes: >
      Section 20 states Type = RATIONAL, count 6; Appendix A lists Type = LONG, count
      2*SamplesPerPixel. Inconsistency in the document.

dependencies:
