      1039: "ICC Profile, raw ICC profile bytes (0x040F) -- duplicates TIFF tag 34675"
      1060: "XMP metadata, File info as XML (0x0424) -- duplicates TIFF tag 700"
      "2000-2997": "Path Information / saved paths (0x07D0-0x0BB6), 26-byte path point records"
      2999: "Name of clipping path (0x0BB7)"
