dependencies:
  - id: PSFF-DEP-001
    requirement: PSFF-026
    when: "Compression(259) != 1"
    then: "StripByteCounts(279) is required to be present when Photoshop reads the file."
    kind: requires
    tags: [259, 279]
  - id: PSFF-DEP-002
    requirement: PSFF-033
    when: "Compression(259) != 1 AND TileWidth(322)/TileLength(323) present (tiled image)"
    then: "TileByteCounts(325) is required to be present when Photoshop reads the file."
    kind: requires
    tags: [259, 322, 323, 325]
  - id: PSFF-DEP-003
    requirement: PSFF-025
    when: "Compression(259) == 1 (uncompressed)"
    then: "Photoshop, as a writer, emits a single strip (RowsPerStrip(278) covers the whole image)."
    kind: selects-default
    tags: [259, 278]
  - id: PSFF-DEP-004
    requirement: PSFF-025
    when: "Compression(259) != 1 (compressed)"
    then: "Photoshop, as a writer, emits multiple strips (RowsPerStrip(278) less than the whole image)."
    kind: selects-default
    tags: [259, 278]
  - id: PSFF-DEP-005
    requirement: PSFF-035
    when: "PhotometricInterpretation(262) indicates a CMYK image"
    then: "DotRange(336) is required to be present when Photoshop reads the file."
    kind: requires
    tags: [262, 336]
  - id: PSFF-DEP-006
    requirement: PSFF-036
    when: "Photoshop version >= 6.0 (writer)"
    then: "ExtraSamples(338) is written as 0 or 1 per extra sample (TIFF 6.0 semantics: 0 = unspecified, 1 = associated alpha), rather than always 0 as in Photoshop 5.5 and earlier."
    kind: modifies-meaning
    tags: [338]
