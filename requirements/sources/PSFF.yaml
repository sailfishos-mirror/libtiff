    description: >
      "Photoshop image resources": contains a sequence of Image Resource
      Blocks (see the Image Resources Section of this document), each block
      beginning with signature '8BIM', a 2-byte resource ID, a Pascal-string
      name padded to even length, a 4-byte data-size field, and resource data
      padded to even length. Resource IDs of particular interest for TIFF
      interchange include 0x03ED (1005, ResolutionInfo), 0x0404 (1028,
      IPTC-NAA record), 0x040F (1039, ICC Profile), 0x0424 (1060, XMP
      metadata), 0x07D0-0x0BB6 (2000-2997, saved paths), and 0x0BB7 (2999,
      clipping path name). This document does not state the tag's TIFF data
      type or count; conventionally implementations treat it as an opaque
      byte block.
    values:
