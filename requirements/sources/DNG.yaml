    section: "Additional Tags for Version 1.6.0.0"
    page: 73
    supplement_version: "1.6.0.0"
    description: >
      String identifying the semantic mask; strongly recommended to be unique across masks.
      Required tag in a semantic mask IFD.
    interacts_with: [52528, 52543]

  - code: 52528
    hex: "0xCD30"
    name: SemanticInstanceID
    types: [ASCII]
    count: "String length including null"
    default: null
    required: no
    conformance: DNG
    location: semantic-mask-ifd
    section: "Additional Tags for Version 1.6.0.0"
    page: 73
    supplement_version: "1.6.0.0"
    description: >
      String identifying a specific instance in a semantic mask; relates content across masks
      within one DNG file (not across files).

  - code: 52536
    hex: "0xCD38"
    name: MaskSubArea
    types: [LONG]
    count: "4"
    default: "0, 0, MaskWidth, MaskHeight"
    required: no
    conformance: DNG
    location: semantic-mask-ifd
    section: "Additional Tags for Version 1.6.0.0"
    page: 74
    supplement_version: "1.6.0.0"
    description: >
      Crop rectangle of this IFD's mask relative to the main image: T_crop, L_crop, W_full
      (uncropped width), H_full (uncropped height). Pixels outside are 0.

  - code: 52543
    hex: "0xCD3F"
    name: RGBTables
    types: [UNDEFINED]
    count: "See structure (NumTables, CompositeMethod, per-table data)"
    default: null
    required: no
    conformance: DNG
    location: ifd0-or-camera-profile-ifd
    section: "Additional Tags for Version 1.6.0.0"
    page: 75
    supplement_version: "1.6.0.0"
    description: >
      RGB-to-RGB color lookup tables associated with Semantic Masks. NumTables 1..20;
      CompositeMethod 0 (Weighted Sum) or 1 (Sequential); per table Divisions 2..32, PixelType
      0/1/2, GammaEncoding 0..4, ColorPrimaries 0..4, GamutExtension 0/1. IFD0 in 1.6; IFD0 or
      profile in 1.7 (profile takes precedence).
    interacts_with: [52526, 52551, 50940]

  - code: 52529
    hex: "0xCD31"
    name: CalibrationIlluminant3
    types: [SHORT]
    count: "1"
    default: "0 (unknown)"
    required: no
    conformance: DNG
    location: ifd0-or-camera-profile-ifd
    section: "Additional Tags for Version 1.6.0.0"
    page: 81
    supplement_version: "1.6.0.0"
    description: >
      Illuminant for the third color calibration set (Exif LightSource values; 255=Other needs
      IlluminantData3).
    interacts_with: [52531, 52530, 52535, 50778, 50779]

  - code: 52531
    hex: "0xCD33"
    name: ColorMatrix3
    types: [SRATIONAL]
    count: "ColorPlanes * 3"
    default: null
    required: conditional
    conformance: DNG
    location: ifd0-or-camera-profile-ifd
    section: "Additional Tags for Version 1.6.0.0"
    page: 81
    supplement_version: "1.6.0.0"
    description: >
      Matrix converting XYZ to reference camera native color space under the third illuminant.
      Required if CalibrationIlluminant3 is included.
    interacts_with: [52529]

  - code: 52530
    hex: "0xCD32"
    name: CameraCalibration3
    types: [SRATIONAL]
    count: "ColorPlanes * ColorPlanes"
    default: "Identity matrix"
    required: no
    conformance: DNG
    location: ifd0
    section: "Additional Tags for Version 1.6.0.0"
    page: 82
    supplement_version: "1.6.0.0"
    description: >
      Calibration matrix from reference to individual camera native space under illuminant 3.
    interacts_with: [50931, 50932, 52529]

  - code: 52538
    hex: "0xCD3A"
    name: ReductionMatrix3
    types: [SRATIONAL]
    count: "ColorPlanes * 3"
    default: null
    required: no
    conformance: DNG
    location: ifd0-or-camera-profile-ifd
    section: "Additional Tags for Version 1.6.0.0"
    page: 82
    supplement_version: "1.6.0.0"
    description: >
      Dimensionality reduction matrix under illuminant 3. Only usable if ColorPlanes > 3. Note
      spec Count text reads ColorPlanes*3 (row scan order).
    interacts_with: [52529]

  - code: 52537
    hex: "0xCD39"
    name: ProfileHueSatMapData3
    types: [FLOAT]
    count: "HueDivisions * SaturationDivisions * ValueDivisions * 3"
    default: null
    required: no
    conformance: DNG
    location: ifd0-or-camera-profile-ifd
    section: "Additional Tags for Version 1.6.0.0"
    page: 83
    supplement_version: "1.6.0.0"
    description: >
      Third HueSatMap table (same format as ProfileHueSatMapData1).
    interacts_with: [50937, 52529]

  - code: 52532
    hex: "0xCD34"
    name: ForwardMatrix3
    types: [SRATIONAL]
    count: "ColorPlanes * 3"
    default: null
    required: no
    conformance: DNG
    location: ifd0-or-camera-profile-ifd
    section: "Additional Tags for Version 1.6.0.0"
    page: 83
    supplement_version: "1.6.0.0"
    description: >
      Matrix mapping white-balanced camera colors to XYZ D50 under illuminant 3.
    interacts_with: [50964, 50965, 52529]

  - code: 52533
    hex: "0xCD35"
    name: IlluminantData1
    types: [UNDEFINED]
    count: "See structure (x-y or spectral power distribution)"
    default: null
    required: conditional
    conformance: DNG
    location: ifd0-or-camera-profile-ifd
    section: "Additional Tags for Version 1.6.0.0"
    page: 83
    supplement_version: "1.6.0.0"
    description: >
      Custom illuminant 1 data; required when CalibrationIlluminant1=255. DataType 0 = x-y
      chromaticity (x,y RATIONAL); DataType 1 = spectral power distribution (NumLambda>=2,
      MinLambda, LambdaSpacing, values).
    interacts_with: [50778]

  - code: 52534
    hex: "0xCD36"
    name: IlluminantData2
    types: [UNDEFINED]
    count: "See structure (same as IlluminantData1)"
    default: null
    required: conditional
    conformance: DNG
    location: ifd0-or-camera-profile-ifd
    section: "Additional Tags for Version 1.6.0.0"
    page: 85
    supplement_version: "1.6.0.0"
    description: >
      Custom illuminant 2 data; required when CalibrationIlluminant2=255.
    interacts_with: [50779]

  - code: 52535
    hex: "0xCD37"
    name: IlluminantData3
    types: [UNDEFINED]
    count: "See structure (same as IlluminantData1)"
    default: null
    required: conditional
    conformance: DNG
    location: ifd0-or-camera-profile-ifd
    section: "Additional Tags for Version 1.6.0.0"
    page: 85
    supplement_version: "1.6.0.0"
    description: >
      Custom illuminant 3 data; required when CalibrationIlluminant3=255.
    interacts_with: [52529]

  # ---------- v1.7.0.0 tags ----------
  - code: 52544
    hex: "0xCD40"
    name: ProfileGainTableMap2
    types: [UNDEFINED]
    count: "80 + (B * MapPointsV * MapPointsH * MapPointsN)"
    default: null
    required: no
    conformance: DNG
    location: ifd0-or-camera-profile-ifd
    section: "Additional Tags for Version 1.7.0.0"
    page: 86
    supplement_version: "1.7.0.0"
    description: >
      Extended ProfileGainTableMap adding DataType (0=uint8,1=uint16,2=float16,3=float32),
      Gamma (0.25..4.0), GainMin, GainMax. Supersedes ProfileGainTableMap when both present.
    interacts_with: [52525]

  - code: 52548
    hex: "0xCD44"
    name: ImageSequenceInfo
    types: [UNDEFINED]
    count: "Byte count of data"
    default: null
    required: no
    conformance: DNG
    location: ifd0
    section: "Additional Tags for Version 1.7.0.0"
    page: 88
    supplement_version: "1.7.0.0"
    description: >
      Informative: relates this image to others in a sequence (SequenceID, SequenceType, Frame
      Info, Index, Count, Final).

  - code: 52550
    hex: "0xCD46"
    name: ImageStats
    types: [UNDEFINED]
    count: "Byte count of data"
    default: null
    required: no
    conformance: DNG
    location: raw-ifd
    section: "Additional Tags for Version 1.7.0.0"
    page: 90
    supplement_version: "1.7.0.0"
    description: >
      Informative statistical information about pixel values (child-tag table, big-endian,
      normalized 0.0 black..1.0 white). Values are approximate.
    interacts_with: [50710]

  - code: 52551
    hex: "0xCD47"
    name: ProfileDynamicRange
    types: [UNDEFINED]
    count: "8"
    default: "Optional (Standard Dynamic Range)"
    required: no
    conformance: DNG
    location: ifd0-or-camera-profile-ifd
    section: "Additional Tags for Version 1.7.0.0"
    page: 94
    supplement_version: "1.7.0.0"
    description: >
      Intended output dynamic range of a profile: SHORT Version(=1), SHORT DynamicRange (0=SDR,
      1=HDR), FLOAT HintMaxOutputValue. HDR alters math for several profile tags.
    interacts_with: [50940, 50938, 50939, 52537, 51107, 50982, 51108, 52543]

  - code: 52552
    hex: "0xCD48"
    name: ProfileGroupName
    types: [ASCII, BYTE]
    count: "Length of string including null"
    default: null
    required: no
    conformance: DNG
    location: ifd0-or-camera-profile-ifd
    section: "Additional Tags for Version 1.7.0.0"
    page: 96
    supplement_version: "1.7.0.0"
    description: >
      UTF-8 group name associating related camera profiles (e.g. SDR/HDR variants).

  # ---------- v1.7.1.0 tags ----------
  - code: 52547
    hex: "0xCD43"
    name: ColumnInterleaveFactor
    types: [SHORT, LONG]
    count: "1"
    default: 1
    required: no
    conformance: DNG
    location: raw-ifd
    section: "Additional Tags for Version 1.7.1.0"
    page: 97
    supplement_version: "1.7.1.0"
    description: >
      Number of interleaved column fields. Non-default requires DNGBackwardVersion >= 1.7.1.0.
      Usable with RowInterleaveFactor to store CFA data as subimages.
    interacts_with: [50975, 50707]

  - code: 52553
    hex: "0xCD49"
    name: JXLDistance
    types: [FLOAT]
    count: "1"
    default: null
    required: no
    conformance: DNG
    location: jxl-ifd
    section: "Additional Tags for Version 1.7.1.0"
    page: 97
    supplement_version: "1.7.1.0"
    description: >
      JPEG XL distance parameter used to encode this IFD. 0.0 = lossless; >0.0 = lossy.
    interacts_with: [259]

  - code: 52554
    hex: "0xCD4A"
    name: JXLEffort
    types: [LONG]
    count: "1"
    default: null
    required: no
    conformance: DNG
    location: jxl-ifd
    section: "Additional Tags for Version 1.7.1.0"
    page: 98
    supplement_version: "1.7.1.0"
    description: >
      JPEG XL effort parameter (1 low .. 9 high) used to encode this IFD.
    interacts_with: [259]

  - code: 52555
    hex: "0xCD4B"
    name: JXLDecodeSpeed
    types: [LONG]
    count: "1"
    default: null
    required: no
    conformance: DNG
    location: jxl-ifd
    section: "Additional Tags for Version 1.7.1.0"
    page: 98
    supplement_version: "1.7.1.0"
    description: >
      JPEG XL decode speed parameter (1 slow .. 4 fast) used to encode this IFD.
    interacts_with: [259]

dependencies:
  - id: DNG-DEP-001
    requirement: DNG-006
    when: "masked pixels are stored (not trimmed) in the raw image"
    then: "ActiveArea(50829) must be present to define the non-masked pixel rectangle"
    kind: requires
    tags: [50829]

  - id: DNG-DEP-002
    requirement: DNG-034
    when: "PhotometricInterpretation(262) == 32803 (CFA)"
    then: "CFARepeatPatternDim(33421) and CFAPattern(33422) must be present in the same IFD"
    kind: requires
    tags: [262, 33421, 33422]

  - id: DNG-DEP-003
    requirement: DNG-053
    when: "the image is a non-RGB CFA image"
    then: "CFAPlaneColor(50710) is required"
    kind: requires
    tags: [50710, 33422]

  - id: DNG-DEP-004
    requirement: DNG-054
    when: "the DNG file is non-monochrome"
    then: "ColorMatrix1(50721) is required"
    kind: requires
    tags: [50721]

  - id: DNG-DEP-005
    requirement: DNG-055
    when: "AsShotNeutral(50728) is present"
    then: "AsShotWhiteXY(50729) must not be present"
    kind: forbids
    tags: [50728, 50729]

  - id: DNG-DEP-006
    requirement: DNG-056
    when: "both CalibrationIlluminant1(50778) and CalibrationIlluminant2(50779) are present"
    then: "neither may have value 0 (unknown)"
    kind: constrains-value
    tags: [50778, 50779]

  - id: DNG-DEP-007
    requirement: DNG-068
    when: "CalibrationIlluminant1(50778) == 255 (Other)"
    then: "IlluminantData1(52533) is required; otherwise it is ignored"
    kind: requires
    tags: [50778, 52533]

  - id: DNG-DEP-008
    requirement: DNG-068
    when: "CalibrationIlluminant2(50779) == 255 (Other)"
    then: "IlluminantData2(52534) is required; otherwise it is ignored"
    kind: requires
    tags: [50779, 52534]

  - id: DNG-DEP-009
    requirement: DNG-068
    when: "CalibrationIlluminant3(52529) == 255 (Other)"
    then: "IlluminantData3(52535) is required; otherwise it is ignored"
    kind: requires
    tags: [52529, 52535]

  - id: DNG-DEP-010
    requirement: DNG-044
    when: "CalibrationIlluminant3(52529) is present"
    then: "CalibrationIlluminant1(50778), CalibrationIlluminant2(50779), and ColorMatrix3(52531) must be present; the three illuminant white points must be distinct"
    kind: requires
    tags: [52529, 50778, 50779, 52531]

  - id: DNG-DEP-011
    requirement: DNG-044
    when: "CalibrationIlluminant3(52529) is present"
    then: "either all three ForwardMatrix tags (50964,50965,52532) are present or none are"
    kind: constrains-value
    tags: [52529, 50964, 50965, 52532]

  - id: DNG-DEP-012
    requirement: DNG-044
    when: "CalibrationIlluminant3(52529) is present"
    then: "either all three ReductionMatrix tags (50725,50726,52538) are present or none are"
    kind: constrains-value
    tags: [52529, 50725, 50726, 52538]

  - id: DNG-DEP-013
    requirement: DNG-044
    when: "CalibrationIlluminant3(52529) is present"
    then: "either all three ProfileHueSatMapData tags (50938,50939,52537) are present or none are"
    kind: constrains-value
    tags: [52529, 50938, 50939, 52537]

  - id: DNG-DEP-014
    requirement: DNG-062
    when: "BlackLevelRepeatDim(50713) = (rows, cols)"
    then: "BlackLevel(50714) count == rows * cols * SamplesPerPixel"
    kind: constrains-value
    tags: [50713, 50714, 277]

  - id: DNG-DEP-015
    requirement: DNG-040
    when: "BlackLevelDeltaH(50715) or BlackLevelDeltaV(50716) is present"
    then: "their counts are ActiveArea(50829) width and length respectively"
    kind: constrains-value
    tags: [50715, 50716, 50829]

  - id: DNG-DEP-016
    requirement: DNG-042
    when: "CameraCalibrationSignature(50931) != ProfileCalibrationSignature(50932) of the selected profile"
    then: "the CameraCalibration1/2/3 tags (50723,50724,52530) must be replaced by identity matrices in the color transform"
    kind: modifies-meaning
    tags: [50931, 50932, 50723, 50724, 52530]

  - id: DNG-DEP-017
    requirement: DNG-061
    when: "more than one camera profile is stored in the file"
    then: "ProfileName(50936) is required for all camera profiles"
    kind: requires
    tags: [50936]

  - id: DNG-DEP-018
    requirement: DNG-064
    when: "more than one camera profile is stored in the file"
    then: "ExtraCameraProfiles(50933) is used to reference the additional Camera Profile IFDs (primary profile stays in IFD 0)"
    kind: requires
    tags: [50933]

  - id: DNG-DEP-019
    requirement: DNG-011
    tags: [50725, 50726, 52538]
    when: "ColorPlanes <= 3"
    then: "ReductionMatrix1/2/3 (50725,50726,52538) may not be used (only when ColorPlanes > 3)"
    kind: forbids

  - id: DNG-DEP-020
    requirement: DNG-041
    when: "matrix tag is used"
    then: "ColorMatrix1/2/3 count == ColorPlanes*3; CameraCalibration1/2/3 count == ColorPlanes*ColorPlanes; ForwardMatrix1/2/3 count == 3*ColorPlanes; AnalogBalance count == ColorPlanes; AsShotNeutral count == ColorPlanes"
    kind: constrains-value
    tags: [50721, 50723, 50964, 50727, 50728]

  - id: DNG-DEP-021
    requirement: DNG-025
    when: "SamplesPerPixel(277) != 1"
    then: "BitsPerSample(258) must be identical for every sample"
    kind: constrains-value
    tags: [258, 277]

  - id: DNG-DEP-022
    requirement: DNG-026
    when: "SampleFormat(339) == 3 (IEEE floating point)"
    then: "BitsPerSample(258) must be 16, 24, or 32"
    kind: constrains-value
    tags: [339, 258]

  - id: DNG-DEP-023
    requirement: DNG-029
    when: "Compression(259) == 34892 (Lossy JPEG)"
    then: "BitsPerSample must be 8 (8-bit integer) and PhotometricInterpretation(262) must be 34892 (LinearRaw) or 52527 (PhotometricMask)"
    kind: constrains-value
    tags: [259, 262, 258]

  - id: DNG-DEP-024
    requirement: DNG-030
    when: "Compression(259) == 52546 (JPEG XL)"
    then: "8 <= BitsPerSample <= 16 integer or 16-bit float; SamplesPerPixel is 1 or 3; PhotometricInterpretation(262) in [0,1,2,4,32803,34892,51177,52527]"
    kind: constrains-value
    tags: [259, 262, 258, 277]

  - id: DNG-DEP-025
    requirement: DNG-032
    when: "Compression(259) == 8 (Deflate)"
    then: "Predictor(317) must be one of 1,2,3,34892,34893,34894,34895"
    kind: constrains-value
    tags: [259, 317]

  - id: DNG-DEP-026
    requirement: DNG-027
    when: "PhotometricInterpretation(262) == 6 (YCbCr) with BitsPerSample 8/8/8, OR == 1 (BlackIsZero) with BitsPerSample 8, and Compression(259)==7"
    then: "the JPEG variant must be baseline DCT JPEG; otherwise lossless Huffman JPEG"
    kind: constrains-value
    tags: [262, 258, 259]

  - id: DNG-DEP-027
    requirement: DNG-051
    when: "non-default SubTileBlockSize(50974) is used"
    then: "DNGBackwardVersion(50707) must be >= 1.2.0.0"
    kind: constrains-value
    tags: [50974, 50707]

  - id: DNG-DEP-028
    requirement: DNG-051
    when: "non-default RowInterleaveFactor(50975) is used"
    then: "DNGBackwardVersion(50707) must be >= 1.2.0.0"
    kind: constrains-value
    tags: [50975, 50707]

  - id: DNG-DEP-029
    requirement: DNG-051
    when: "non-default ColumnInterleaveFactor(52547) is used"
    then: "DNGBackwardVersion(50707) must be >= 1.7.1.0"
    kind: constrains-value
    tags: [52547, 50707]

  - id: DNG-DEP-030
    requirement: DNG-051
    when: "CFALayout(50711) value 6, 7, 8, or 9 is used"
    then: "DNGBackwardVersion(50707) must be >= 1.3.0.0"
    kind: constrains-value
    tags: [50711, 50707]

  - id: DNG-DEP-031
    requirement: DNG-018
    when: "an IFD has NewSubFileType(254) == 16 (enhanced image data)"
    then: "PhotometricInterpretation(262) must be 34892 (LinearRaw); should have EnhanceParams(51182); BlackLevel same for all planes if integer"
    kind: requires
    tags: [254, 262, 51182, 50714]

  - id: DNG-DEP-032
    requirement: DNG-016
    when: "an IFD has NewSubFileType(254) == 8 or 9 (depth map)"
    then: "PhotometricInterpretation(262) should be 51177 (Depth)"
    kind: selects-default
    tags: [254, 262]

  - id: DNG-DEP-033
    requirement: DNG-020
    when: "an IFD has NewSubFileType(254) == 65540 (semantic mask)"
    then: "PhotometricInterpretation(262) should be 52527 (PhotometricMask) and SemanticName(52526) must be present"
    kind: requires
    tags: [254, 262, 52527, 52526]

  - id: DNG-DEP-034
    requirement: DNG-065
    when: "NoiseProfile(51041) is present"
    then: "count must be 2 or 2*ColorPlanes; each S_i > 0 and each O_i >= 0"
    kind: constrains-value
    tags: [51041]

  - id: DNG-DEP-035
    requirement: DNG-071
    when: "both ProfileGainTableMap2(52544) and ProfileGainTableMap(52525) are present"
    then: "readers apply only ProfileGainTableMap2 and ignore ProfileGainTableMap"
    kind: modifies-meaning
    tags: [52544, 52525]

  - id: DNG-DEP-036
    requirement: DNG-070
    when: "a camera profile with RGBTables(52543) is used to render and IFD0 also has RGBTables"
    then: "the profile's RGBTables takes precedence over the IFD0 RGBTables"
    kind: modifies-meaning
    tags: [52543]

  - id: DNG-DEP-037
    requirement: DNG-049
    when: "an optional WarpRectilinear2 (opcode 14) is immediately followed by a WarpRectilinear (1) or WarpFisheye (2) opcode in the same list"
    then: "the reader should skip that following WarpRectilinear/WarpFisheye opcode"
    kind: modifies-meaning
    tags: [51022]

  - id: DNG-DEP-038
    requirement: DNG-069
    when: "RGBTables(52543) table has LengthTableSemanticName == 0"
    then: "that table is the background table; at most one table per RGBTables may be a background table"
    kind: constrains-value
    tags: [52543]

  - id: DNG-DEP-039
    requirement: DNG-072
    when: "ProfileDynamicRange(52551) DynamicRange == 0 (SDR)"
    then: "HintMaxOutputValue must be <= 1"
    kind: constrains-value
    tags: [52551]

  - id: DNG-DEP-040
    requirement: DNG-033
    when: "PhotometricInterpretation(262) == 1 (BlackIsZero) or 2 (RGB) in a preview IFD"
    then: "color space is gamma 2.2 / sRGB respectively unless overridden by PreviewColorSpace(50970)"
    kind: selects-default
    tags: [262, 50970]

  - id: DNG-DEP-041
    requirement: DNG-013
    when: "SampleFormat(339) == 3 with 32-bit integer/float, or transparency/depth data"
    then: "Deflate compression (259 == 8) is permitted for these data types"
    kind: constrains-value
    tags: [339, 259]

  - id: DNG-DEP-042
    requirement: DNG-051
    when: "the main image IFD uses floating point data, or an IFD with NewSubFileType 4, or Compression 8 or 34892"
    then: "DNGBackwardVersion(50707) must be >= 1.4.0.0"
    kind: constrains-value
    tags: [50707, 339, 254, 259]

  - id: DNG-DEP-043
    requirement: DNG-051
    when: "the main image IFD uses Compression(259) == 52546 (JPEG XL)"
    then: "DNGBackwardVersion(50707) must be >= 1.7.0.0"
    kind: constrains-value
    tags: [50707, 259]

  - id: DNG-DEP-044
    requirement: DNG-050
    when: "a per-row/per-column opcode (DeltaPerRow/Column, ScalePerRow/Column) is applied"
    then: "the Count parameter must match the number of affected rows/columns in the specified area"
    kind: constrains-value
    tags: [51008, 51009, 51022]

