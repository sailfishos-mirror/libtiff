  # ---- Interoperability IFD tag ----
  - code: 1
    hex: "0x0001"
    name: InteroperabilityIndex
    types: [ASCII]
    count: "Any"
    default: null
    required: conditional
    conformance: EXIF
    location: interop-ifd
    section: "4.6.7.A"
    page: 78
    description: >
      Identification of the interoperability rule (4 bytes incl. NULL). Note: tag code 1 collides
      with GPSLatitudeRef but resides in a different IFD (Interoperability IFD).
    values:
      R98: "Exif R98 file / DCF basic file"
      THM: "DCF thumbnail file"
      R03: "DCF Option File"
    notes: >
      In Exif IFD's Interoperability IFD: N for uncompressed, Optional (O) for compressed.

dependencies:
  - id: EXIF-DEP-001
    requirement: EXIF-025
    when: "ExifIFDPointer(34665) present"
    then: "The offset points from the TIFF header start to an Exif IFD with valid TIFF IFD structure and no image data"
    kind: requires
    tags: [34665]

  - id: EXIF-DEP-002
    requirement: EXIF-026
    when: "GPSInfoIFDPointer(34853) present"
    then: "The offset points to a GPS Info IFD with valid TIFF IFD structure and no image data; GPSVersionID(0) must be present"
    kind: requires
    tags: [34853, 0]

  - id: EXIF-DEP-003
    requirement: EXIF-027
    when: "InteroperabilityIFDPointer(40965) present"
    then: "It is located in the Exif IFD and points to an Interoperability IFD with valid TIFF IFD structure and no image data"
    kind: requires
    tags: [40965]

  - id: EXIF-DEP-004
    requirement: EXIF-029
    when: "primary image is JPEG compressed"
    then: "ImageWidth(256), ImageLength(257), BitsPerSample(258), PhotometricInterpretation(262), SamplesPerPixel(277), PlanarConfiguration(284), YCbCrSubSampling(530), Compression(259), StripOffsets(273), RowsPerStrip(278), StripByteCounts(279) must NOT be recorded in the 0th IFD"
    kind: forbids
    tags: [256, 257, 258, 259, 262, 273, 277, 278, 279, 284, 530]

  - id: EXIF-DEP-005
    requirement: EXIF-045
    when: "file is compressed"
    then: "PixelXDimension(40962) and PixelYDimension(40963) must be present; must NOT be present when file is uncompressed"
    kind: requires
    tags: [40962, 40963]

  - id: EXIF-DEP-006
    requirement: EXIF-072
    when: "file is compressed"
    then: "ComponentsConfiguration(37121) is mandatory; it is forbidden (N) when file is uncompressed"
    kind: requires
    tags: [37121]

  - id: EXIF-DEP-007
    requirement: EXIF-068
    when: "PhotometricInterpretation(262) == 6 (YCbCr) and uncompressed"
    then: "YCbCrSubSampling(530) and YCbCrPositioning(531) are mandatory in the 0th IFD"
    kind: requires
    tags: [262, 530, 531]

  - id: EXIF-DEP-008
    requirement: EXIF-070
    when: "PhotometricInterpretation(262) == 2 (RGB), chunky or planar uncompressed"
    then: "YCbCrCoefficients(529), YCbCrSubSampling(530), YCbCrPositioning(531) are forbidden (N)"
    kind: forbids
    tags: [262, 529, 530, 531]

  - id: EXIF-DEP-009
    requirement: EXIF-034
    when: "image resolution is unknown"
    then: "XResolution(282)=72, YResolution(283)=72, ResolutionUnit(296)=2 (inches)"
    kind: selects-default
    tags: [282, 283, 296]

  - id: EXIF-DEP-010
    requirement: EXIF-034
    when: "always"
    then: "YResolution(283) must equal XResolution(282) and share the same ResolutionUnit(296)"
    kind: constrains-value
    tags: [282, 283, 296]

  - id: EXIF-DEP-011
    requirement: EXIF-039
    when: "PhotometricInterpretation(262) == 2 (RGB)"
    then: "ReferenceBlackWhite(532) default = [0,255,0,255,0,255]"
    kind: selects-default
    tags: [262, 532]

  - id: EXIF-DEP-012
    requirement: EXIF-039
    when: "PhotometricInterpretation(262) == 6 (YCbCr)"
    then: "ReferenceBlackWhite(532) default = [0,255,0,128,0,128]"
    kind: selects-default
    tags: [262, 532]

  - id: EXIF-DEP-013
    requirement: EXIF-046
    when: "RGB uncompressed"
    then: "ComponentsConfiguration(37121) default = 4 5 6 0; otherwise default = 1 2 3 0"
    kind: selects-default
    tags: [37121, 262]

  - id: EXIF-DEP-014
    requirement: EXIF-018
    when: "thumbnail is JPEG compressed"
    then: "1st IFD Compression(259)=6 and JPEGInterchangeFormat(513) and JPEGInterchangeFormatLength(514) must be present; StripOffsets(273)/RowsPerStrip(278)/StripByteCounts(279) forbidden"
    kind: requires
    tags: [259, 513, 514, 273, 278, 279]

  - id: EXIF-DEP-015
    requirement: EXIF-016
    when: "primary image is uncompressed (RGB or YCbCr)"
    then: "thumbnail must NOT be JPEG compressed"
    kind: forbids
    tags: [259]

  - id: EXIF-DEP-016
    requirement: EXIF-037
    when: "primary image is JPEG"
    then: "JPEGInterchangeFormat(513) and JPEGInterchangeFormatLength(514) must NOT be used for the primary image"
    kind: forbids
    tags: [513, 514]

  - id: EXIF-DEP-017
    requirement: EXIF-054
    when: "StandardOutputSensitivity(34865) or RecommendedExposureIndex(34866) or ISOSpeed(34867) is recorded"
    then: "PhotographicSensitivity(34855) and SensitivityType(34864) must also be recorded"
    kind: requires
    tags: [34855, 34864, 34865, 34866, 34867]

  - id: EXIF-DEP-018
    requirement: EXIF-055
    when: "ISOSpeedLatitudeyyy(34868) is recorded"
    then: "ISOSpeed(34867) and ISOSpeedLatitudezzz(34869) must also be recorded"
    kind: requires
    tags: [34867, 34868, 34869]

  - id: EXIF-DEP-019
    requirement: EXIF-055
    when: "ISOSpeedLatitudezzz(34869) is recorded"
    then: "ISOSpeed(34867) and ISOSpeedLatitudeyyy(34868) must also be recorded"
    kind: requires
    tags: [34867, 34868, 34869]

  - id: EXIF-DEP-020
    requirement: EXIF-053
    when: "PhotographicSensitivity(34855) is recorded"
    then: "SensitivityType(34864) should also be recorded; PhotographicSensitivity clamped to 65535 if value >= 65535; use count 1"
    kind: constrains-value
    tags: [34855, 34864]

  - id: EXIF-DEP-021
    requirement: EXIF-061
    when: "GPS Info IFD present (GPSInfoIFDPointer 34853)"
    then: "GPSVersionID(0) is mandatory with value 2.3.0.0"
    kind: requires
    tags: [0, 34853]

  - id: EXIF-DEP-022
    requirement: EXIF-062
    when: "GPSLatitude(2) is recorded"
    then: "GPSLatitudeRef(1) is needed to interpret it (N/S); likewise GPSLongitude(4) needs GPSLongitudeRef(3)"
    kind: requires
    tags: [1, 2, 3, 4]

  - id: EXIF-DEP-023
    requirement: EXIF-063
    when: "GPSAltitudeRef(5) == 1"
    then: "GPSAltitude(6) is expressed as an absolute value (below sea level)"
    kind: modifies-meaning
    tags: [5, 6]

  - id: EXIF-DEP-024
    requirement: EXIF-033
    when: "YCbCrPositioning(531) absent"
    then: "reader assumes TIFF default 1 (centered); reader unable to support both must follow TIFF default regardless of recorded value"
    kind: selects-default
    tags: [531]

  - id: EXIF-DEP-025
    requirement: EXIF-043
    when: "ExifVersion(36864) absent"
    then: "file is treated as non-conformant to the Exif standard"
    kind: constrains-value
    tags: [36864]

  - id: EXIF-DEP-026
    requirement: EXIF-041
    when: "a two-byte (non-ASCII) character code is needed for a comment"
    then: "UserComment(37510) must be used instead of ImageDescription(270)"
    kind: requires
    tags: [270, 37510]

  - id: EXIF-DEP-027
    requirement: EXIF-013
    when: "no 1st IFD (thumbnail) is recorded"
    then: "the 0th IFD next-IFD offset must terminate with 00000000.H"
    kind: constrains-value
    tags: []

  - id: EXIF-DEP-028
    requirement: EXIF-046
    when: "uncompressed data"
    then: "ComponentsConfiguration(37121) is forbidden (N); component arrangement is given by PhotometricInterpretation(262) instead"
    kind: forbids
    tags: [37121, 262]

  - id: EXIF-DEP-029
    requirement: EXIF-072
    when: "uncompressed data"
    then: "CompressedBitsPerPixel(37122) and InteroperabilityIFDPointer(40965) are forbidden (N)"
    kind: forbids
    tags: [37122, 40965]

  - id: EXIF-DEP-030
    requirement: EXIF-075
    when: "uncompressed data"
    then: "InteroperabilityIndex(1) in the Interoperability IFD is forbidden (N)"
    kind: forbids
    tags: [1]
