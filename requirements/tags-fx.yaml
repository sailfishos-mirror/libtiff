# =============================================================================
# TIFF/FX tag registry: tags defined by RFC 3949 (File Format for Internet Fax)
# =============================================================================
#
# Source: RFC 3949 (obsoletes RFC 2301; Annex B lists the technical changes) —
# see sources/TFX.yaml for per-tag citations. Constraints RFC 3949 places on
# classic tags (FillOrder, Compression 3/4/7/9/10, PhotometricInterpretation
# 10 ITULAB, resolutions, page sizes) are captured as fax profile entries and
# DEP-170.. rules in constraints.yaml.
#
# Same field conventions as tags.yaml, plus:
#   location   ifd0             — page IFDs of the primary IFD chain
#              global-params-ifd — resides in the IFD pointed to by
#                                  GlobalParametersIFD (400)
#              sub-ifd          — resides in MRC child IFDs (Profile M)
#   description  short semantic summary.
# =============================================================================

tags:
- code: 326
  name: BadFaxLines
  since: TFX
  last: null
  status: current
  conformance: TFX
  container: both
  location: ifd0
  types:
  - SHORT
  - LONG
  count: '1'
  default: null
  required: 'no'
  defined_in:
  - TFX
  description: >
    Number of "bad" scanlines (decoding to an incorrect pixel count) encountered during reception.
    PercentBad = (BadFaxLines/ImageLength)*100. Profile F only. No default.
- code: 327
  name: CleanFaxData
  since: TFX
  last: null
  status: current
  conformance: TFX
  container: both
  location: ifd0
  types:
  - SHORT
  count: '1'
  default: null
  required: 'no'
  values:
    0: No bad lines
    1: Bad lines exist but were regenerated by the receiver
    2: Bad lines exist but have not been regenerated
  defined_in:
  - TFX
  description: >
    Indicates whether bad lines are stored or were replaced by the receiver. Profile F only.
    No default.
- code: 328
  name: ConsecutiveBadFaxLines
  since: TFX
  last: null
  status: current
  conformance: TFX
  container: both
  location: ifd0
  types:
  - LONG
  - SHORT
  count: '1'
  default: null
  required: 'no'
  defined_in:
  - TFX
  description: >
    Maximum number of consecutive bad scanlines received; an indicator of the distribution
    of bad lines. Profile F only. No default.
- code: 400
  name: GlobalParametersIFD
  since: TFX
  last: null
  status: current
  conformance: TFX
  container: both
  location: ifd0
  types:
  - IFD
  - LONG
  count: '1'
  default: null
  required: 'no'
  defined_in:
  - TFX
  description: >
    Points to an IFD containing global parameters describing the fax session. Located in a
    Primary IFD; recommended to be placed in the first IFD, immediately after the header.
    Each field in the GlobalParametersIFD is legal in any IFD; required baseline fields should
    not be placed there. On conflict, the image IFD prevails. Profile S writers should not
    use it.
- code: 401
  name: ProfileType
  since: TFX
  last: null
  status: current
  conformance: TFX
  container: both
  location: global-params-ifd
  types:
  - LONG
  count: '1'
  default: null
  required: 'no'
  values:
    0: Unspecified
    1: Group 3 fax
  defined_in:
  - TFX
  description: Type of image data stored in the file. Resides in the GlobalParametersIFD.
    No default.
  notes: >
    GlobalParametersIFD-resident field; location any-ifd used because the addendum vocabulary
    has no dedicated GlobalParametersIFD value.
- code: 402
  name: FaxProfile
  since: TFX
  last: null
  status: current
  conformance: TFX
  container: both
  location: global-params-ifd
  types:
  - BYTE
  count: '1'
  default: null
  required: 'no'
  values:
    0: Does not conform to a defined TIFF-FX profile
    1: 'Profile S: minimal black & white lossless'
    2: 'Profile F: extended black & white lossless'
    3: 'Profile J: lossless JBIG black & white'
    4: 'Profile C: lossy color and grayscale'
    5: 'Profile L: lossless color and grayscale'
    6: 'Profile M: Mixed Raster Content'
  defined_in:
  - TFX
  description: The TIFF-FX profile that applies to the file. Resides in the GlobalParametersIFD.
  notes: GlobalParametersIFD-resident field; location any-ifd used per addendum flag.
- code: 403
  name: CodingMethods
  since: TFX
  last: null
  status: current
  conformance: TFX
  container: both
  location: global-params-ifd
  types:
  - LONG
  count: '1'
  default: null
  required: 'no'
  values:
    1: 'Bit 0: unspecified compression'
    2: 'Bit 1: T.4 1-D coding (MH)'
    4: 'Bit 2: T.4 2-D coding (MR)'
    8: 'Bit 3: T.6 coding (MMR)'
    16: 'Bit 4: T.82 coding using T.85 (JBIG)'
    32: 'Bit 5: T.81 (Baseline JPEG)'
    64: 'Bit 6: T.82 coding using T.43 (JBIG color)'
  defined_in:
  - TFX
  description: >
    Bit field indicating which coding methods are used in the file (bit=1 means used). Resides
    in the GlobalParametersIFD. Limit of 32 compression types.
  notes: >
    GlobalParametersIFD-resident field; location any-ifd used per addendum flag. Values shown
    are the integer weights of the individual flag bits; more than one may be set. Bits 7-31
    reserved.
- code: 404
  name: VersionYear
  since: TFX
  last: null
  status: current
  conformance: TFX
  container: both
  location: global-params-ifd
  types:
  - BYTE
  count: '4'
  default: null
  required: 'no'
  defined_in:
  - TFX
  description: >
    Year of the standard specified by FaxProfile(402), as 4 characters (e.g., '1997'). Used
    in the lossy and lossless color profiles (C, L). Resides in the GlobalParametersIFD.
  notes: GlobalParametersIFD-resident field; location any-ifd used per addendum flag.
- code: 405
  name: ModeNumber
  since: TFX
  last: null
  status: current
  conformance: TFX
  container: both
  location: global-params-ifd
  types:
  - BYTE
  count: '1'
  default: null
  required: 'no'
  values:
    0: Mode 1.0
  defined_in:
  - TFX
  description: >
    Mode of the standard specified by FaxProfile(402); value 0 indicates Mode 1.0. Used in
    the Mixed Raster Content profile (Profile M). Resides in the GlobalParametersIFD.
  notes: GlobalParametersIFD-resident field; location any-ifd used per addendum flag.
- code: 433
  name: Decode
  since: TFX
  last: null
  status: current
  conformance: TFX
  container: both
  location: ifd0
  types:
  - SRATIONAL
  count: 2 * SamplesPerPixel
  default: null
  required: conditional
  defined_in:
  - TFX
  description: >
    Maps image sample values into the range appropriate for the current color space, in min/max
    pairs per component. Required with the ITULAB encoding (PhotometricInterpretation = 10)
    in Profiles C, L, and M. For 8-bit L*a*b* the default is (0, 100, -21760/255, 21590/255,
    -19200/255, 31800/255).
- code: 434
  name: ImageBaseColor
  since: TFX
  last: null
  status: current
  conformance: TFX
  container: both
  location: sub-ifd
  types:
  - SHORT
  count: SamplesPerPixel
  default: null
  required: 'no'
  defined_in:
  - TFX
  description: >
    Profile M only: default image color used where no image data exists (no strips, or a strip
    with StripByteCounts = 0). Interpreted with the IFD's L*a*b* parameters if the data is
    ITU L*a*b*, otherwise as 8 bits/sample, 3 samples/pixel ITU L*a*b*. Default: black for
    Foreground, white for Background/other.
  notes: >
    Formerly named DefaultImageColor (renamed per Annex B). Appears in MRC layer IFDs including
    child IFDs; location any-ifd used per addendum vocabulary limits. Resides in MRC child
    IFDs (Profile M); primary-IFD use per profile rules.
- code: 435
  name: T82Options
  since: TFX
  last: null
  status: current
  conformance: TFX
  container: both
  location: ifd0
  types:
  - LONG
  count: '1'
  default: 0
  required: conditional
  values:
    0: ITU-T T.85 profile of T.82
  defined_in:
  - TFX
  description: >
    Required when Compression(259) = 9 (Profile J) and used for the Mask layer of Profile
    M. Individual bits indicate the applicable JBIG profile; all bits 0 = ITU-T T.85 profile
    of T.82. Default all bits 0; may be omitted if this is the value.
- code: 559
  name: StripRowCounts
  since: TFX
  last: null
  status: current
  conformance: TFX
  container: both
  location: ifd0
  types:
  - LONG
  count: number of strips
  default: null
  required: conditional
  defined_in:
  - TFX
  description: >
    Profile M only: number of scanlines stored in each strip, allowing a variable number per
    strip. For strips with more than one layer, maximum strip size is 256 scanlines or full
    page. Replaces RowsPerStrip(278) for variable-size strips; only one of the two may appear
    in an IFD. Profile M readers must support it.
- code: 34732
  name: ImageLayer
  since: TFX
  last: null
  status: current
  conformance: TFX
  container: both
  location: sub-ifd
  types:
  - LONG
  count: '2'
  default: null
  required: conditional
  values:
    1: 'ImageLayer[0]=1: Background layer (shown where Mask=0)'
    2: 'ImageLayer[0]=2: Mask layer (must be Primary IFD, full page)'
    3: 'ImageLayer[0]=3: Foreground layer (shown where Mask=1)'
  defined_in:
  - TFX
  description: >
    Profile M only: identifies the MRC layer and imaging order of an IFD. ImageLayer[0] =
    layer (1 Background, 2 Mask, 3 Foreground); ImageLayer[1] = imaging order within the layer
    (1 first, 2 second, ...). Required on the Primary IFD and every MRC-specific child IFD.
  notes: >
    Appears in the Primary IFD and MRC child IFDs; location any-ifd used per addendum vocabulary
    limits. Resides in MRC child IFDs (Profile M); primary-IFD use per profile rules.
