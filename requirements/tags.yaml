  - code: 266
    name: FillOrder
    since: "4.0"
    last: null
    status: current
    conformance: baseline
    container: both
    types: [SHORT]
    count: "1"
    default: 1
    required: no
    values:
      1: "Lower column values in higher-order bits (MSB-first)"
      2: "Lower column values in lower-order bits (LSB-first); baseline readers need not support"
    defined_in: [T4, T5, T6B, T6X]
    notes: >
      FillOrder = 2 is recommended only for localized/transient facsimile
      use; FillOrder = 1 for interchange. LZW data is always FillOrder 1.

  - code: 269
    name: DocumentName
