# =============================================================================
# TIFF tag registry, unified across all specification revisions and supplements
# =============================================================================
#
# One entry per tag code. This file is the canonical machine-readable tag
# table; tags.md is generated from it. Cross-tag validity rules live in
# constraints.yaml (DEP-*); behavioral per-tag requirements live in
# tag-requirements.md (TAG-<code>-NN).
#
# Fields:
#   code         decimal tag code
#   name         current canonical name (see name_history for renames)
#   since        first specification defining the tag: a core revision
#                ("4.0", "5.0", "6.0") or a supplement ID (PM6, PS, TN2, TN3,
#                BIGTIFF - all of which imply the TIFF 6.0 era)
#   last         last core revision in which the tag was valid; null = current
#   status       current | deprecated | retired | draft-proposal
#   conformance  baseline | extension | <supplement ID>  (classification as of
#                TIFF 6.0; earlier classifications noted in `notes`)
#   container    classic | bigtiff | both
#   location     recorded only where a source document restricts placement
#                (e.g. "ifd0" = 0th/primary IFD only, per XMP Part 3 for the
#                metadata-carrier and Exif-pointer tags). Absent = any IFD of
#                the primary chain. Exif/GPS/Interop-IFD-resident tags live in
#                tags-exif.yaml; DNG tags in tags-dng.yaml; TIFF/FX tags in
#                tags-fx.yaml - each with its own location vocabulary.
#   types        allowed TIFF field types (current spec)
#   bigtiff_types  additional types allowed in a BigTIFF container, if any
#   type_history / name_history  changes across revisions
#   count        value count; expression where variable (SPP = SamplesPerPixel)
#   default      default value; null = no default
#   required     no | yes | conditional  (as of TIFF 6.0; per-class detail in
#                image-classes.md and constraints.yaml)
#   values       enumerated values. Simple form `value: meaning`, or rich form
#                `value: {meaning, since, status}` where values were added or
#                deprecated over time. Bit-flag fields use keys bit0, bit1...
#   defined_in   source extractions containing this tag's per-document entry
#                (see sources/<DOC>.yaml, which carries section/page cites)
#   notes        history, ambiguities, known spec inconsistencies
#
# Requirement IDs citable against this file: each entry implies the generic
# validation rules TAG-<code>-TYPE (field type must be one of `types`),
# TAG-<code>-COUNT (count must match), TAG-<code>-VALUE (value must be an
# allowed enumerated value), evaluated per the container and version in use.
# =============================================================================

tags:
  - code: 254
    name: NewSubfileType
    since: "5.0"
    last: null
    status: current
    conformance: baseline
    container: both
    types: [LONG]
    count: "1"
    default: 0
    required: no
    values:
      bit0: "Image is a reduced-resolution version of another image in this file"
      bit1: "Image is a single page of a multi-page image (see PageNumber 297)"
      bit2: "Image is a transparency mask for another image in this file (PhotometricInterpretation must be 4)"
      bit3: {meaning: "Depth map (value 8 = highest-resolution, 9 = reduced-resolution depth map)", since: DNG, conformance: DNG, notes: "DNG 1.5+"}
      bit4: {meaning: "TIFF/FX: MRC-related IFD (value 16 = MRC child IFD, 18 = MRC primary IFD); DNG 1.5+ reuses the bit as value 16 = enhanced image data", since: TFX, conformance: TFX, notes: "Bit 4 meaning is domain-dependent (fax MRC vs DNG enhanced image); disambiguate via FaxProfile (402) / DNGVersion (50706)"}
      bit16: {meaning: "DNG qualifier bit: value 65537 (0x10001) = alternate/non-primary rendered preview, 65540 (0x10004) = semantic mask", since: DNG, conformance: DNG, notes: "DNG 1.2+ (65537), 1.6+ (65540)"}
    defined_in: [T5, T6B, TFX, DNG]
    notes: >
      Replaces SubfileType (255). TIFF/FX requires the field to be written
      explicitly on every fax page; DNG uses the value to assign IFD roles
      (raw/preview/enhanced/depth/semantic-mask), see tags-dng.yaml and the
      DEP-160 group.

  - code: 255
    name: SubfileType
    since: "4.0"
    last: null
    status: deprecated
    conformance: baseline
    container: both
    types: [SHORT]
    count: "1"
    default: null
    required: no
    values:
      1: "Full-resolution image data"
      2: "Reduced-resolution image data"
      3: "Single page of a multi-page image (see PageNumber 297)"
    defined_in: [T4, T5, T6B]
    notes: >
      Deprecated in favour of NewSubfileType (254) from revision 5.0 onward.
      In TIFF 4.0 this was the only subfile classification and values 1/2
      made ImageWidth/ImageLength/StripOffsets required.

  - code: 256
    name: ImageWidth
    since: "4.0"
    last: null
    status: current
    conformance: baseline
    container: both
    types: [SHORT, LONG]
    count: "1"
    default: null
    required: yes
    type_history:
      - {version: "4.0", types: [SHORT], notes: "Formal definition SHORT only; §3 prose already claims SHORT or LONG (internal inconsistency, see sources/T4.yaml)"}
      - {version: "5.0", types: [SHORT, LONG]}
    defined_in: [T4, T5, T6B]

  - code: 257
    name: ImageLength
    since: "4.0"
    last: null
    status: current
    conformance: baseline
    container: both
    types: [SHORT, LONG]
    count: "1"
    default: null
    required: yes
    type_history:
      - {version: "4.0", types: [SHORT], notes: "Same inconsistency as ImageWidth (256)"}
      - {version: "5.0", types: [SHORT, LONG]}
    defined_in: [T4, T5, T6B]

  - code: 258
    name: BitsPerSample
    since: "4.0"
    last: null
    status: current
    conformance: baseline
    container: both
    types: [SHORT]
    count: "SPP"
    default: 1
    required: conditional
    defined_in: [T4, T5, T6B, TN3]
    notes: >
      Baseline allows 1 (bilevel), 4/8 (grayscale, palette), 8,8,8 (RGB).
      Larger and mixed depths are extensions. TN3 adds 16 and 24 as valid
      widths when SampleFormat (339) = 3 (reduced-precision floating point).

  - code: 259
    name: Compression
    since: "4.0"
    last: null
    status: current
    conformance: baseline
    container: both
    types: [SHORT]
    count: "1"
    default: 1
    required: no
    count_history:
      - {version: "4.0", count: "SPP", notes: "TIFF 4.0 allowed one value per sample; 5.0 onward count = 1"}
      - {version: "5.0", count: "1"}
    values:
      1: {meaning: "No compression", since: "4.0"}
      2: {meaning: "CCITT Group 3 1-D Modified Huffman RLE (bilevel only)", since: "4.0"}
      3: {meaning: "CCITT T.4 bilevel encoding (Group 3 fax); see T4Options (292)", since: "4.0", conformance: extension}
      4: {meaning: "CCITT T.6 bilevel encoding (Group 4 fax); see T6Options (293)", since: "4.0", conformance: extension}
      5: {meaning: "LZW", since: "5.0", conformance: extension}
      6: {meaning: "JPEG per TIFF 6.0 Section 22 ('old-style'); deprecated by TN2, number reserved indefinitely", since: "6.0", status: deprecated, conformance: extension}
      7: {meaning: "JPEG: each strip/tile is a complete ISO/IEC 10918-1 datastream; see JPEGTables (347)", since: "TN2", conformance: TN2}
      8: {meaning: "Deflate (zlib data format, RFC 1950/1951)", since: "PS", conformance: PS}
      9: {meaning: "JBIG per the ITU-T T.85 profile of T.82 (fax Profile J); see T82Options (435)", since: TFX, conformance: TFX}
      10: {meaning: "ITU-T T.43 color/grayscale representation using T.82 JBIG coding (fax Profile L)", since: TFX, conformance: TFX}
      32771: {meaning: "No compression, word-aligned rows", since: "4.0", last: "4.0", status: retired}
      32773: {meaning: "PackBits byte-oriented RLE", since: "4.0"}
      34676: {meaning: "SGILOG adaptive run-length encoding for LogLuv/LogL HDR data (PhotometricInterpretation 32844/32845)", since: LLV, conformance: LLV}
      34677: {meaning: "SGILOG24 packing for the 24-bit LogLuv encoding", since: LLV, conformance: LLV}
      34892: {meaning: "Lossy baseline-DCT JPEG for 8-bit LinearRaw/PhotometricMask data (DNG 1.4+)", since: DNG, conformance: DNG}
      52546: {meaning: "JPEG XL (ISO/IEC 18181-1); DNG 1.7+", since: DNG, conformance: DNG}
    defined_in: [T4, T5, T6B, T6X, TN2, PS, TFX, LLV, DNG]
    notes: >
      Baseline readers must support 1, 2, 32773. Value 32946 is a
      widely-used unofficial synonym for 8 (Deflate) predating the PS
      technote; it appears in no document in this registry but is accepted
      by libtiff (record as vendor deviation, not a requirement).

  - code: 262
    name: PhotometricInterpretation
    since: "4.0"
    last: null
    status: current
    conformance: baseline
    container: both
    types: [SHORT]
    count: "1"
    default: null
    required: yes
    values:
      0: {meaning: "WhiteIsZero (min-is-white grayscale/bilevel)", since: "4.0"}
      1: {meaning: "BlackIsZero (min-is-black grayscale/bilevel)", since: "4.0"}
      2: {meaning: "RGB", since: "4.0"}
      3: {meaning: "Palette color (requires ColorMap 320, SamplesPerPixel = 1)", since: "5.0"}
      4: {meaning: "Transparency mask (SamplesPerPixel = 1, BitsPerSample = 1)", since: "5.0"}
      5: {meaning: "Separated, usually CMYK (see InkSet 332)", since: "6.0", conformance: extension}
      6: {meaning: "YCbCr (see 529-532)", since: "6.0", conformance: extension}
      8: {meaning: "1976 CIE L*a*b*, a*/b* signed -128..127 encoding", since: "6.0", conformance: extension}
      9: {meaning: "ICCLab: CIE L*a*b* with a*/b* offset to 0..255 (a*+128); ICC profile convention", since: "PM6", conformance: PM6}
      10: {meaning: "ITULab: CIE L*a*b* per ITU-T T.42, unsigned sample encoding with ranges/offsets given by Decode (433); fax Profiles C/L/M", since: TFX, conformance: TFX}
      32803: {meaning: "CFA (color filter array, DNG raw IFD); requires CFARepeatPatternDim (33421) and CFAPattern (33422)", since: DNG, conformance: DNG}
      32844: {meaning: "LOGL: grayscale log-luminance HDR encoding (16-bit LogL); pairs with Compression 34676", since: LLV, conformance: LLV}
      32845: {meaning: "LOGLUV: log-luminance + uv chrominance HDR encoding (24- or 32-bit); pairs with Compression 34676/34677", since: LLV, conformance: LLV}
      34892: {meaning: "LinearRaw (DNG raw/enhanced/reduced-resolution IFDs)", since: DNG, conformance: DNG}
      51177: {meaning: "Depth map (DNG 1.5+ depth IFDs)", since: DNG, conformance: DNG}
      52527: {meaning: "PhotometricMask (DNG 1.6+ semantic mask IFDs)", since: DNG, conformance: DNG}
    defined_in: [T4, T5, T6B, T6X, PM6, PS, TFX, LLV, DNG]
    notes: >
      Required since 5.0 (TIFF 4.0 made it optional and told readers to
      ignore it when the compression scheme implies an interpretation).
      Value 10, previously only referenced in ecosystem practice, is
      normatively defined by RFC 3949 (TFX). The LOGL/LOGLUV numeric codes
      are not printed in the LLV paper itself; they are the SGI/libtiff
      registered codes (see sources/LLV.yaml notes).

  - code: 263
    name: Threshholding
    since: "4.0"
    last: null
    status: current
    conformance: baseline
    container: both
    types: [SHORT]
    count: "1"
    default: 1
    required: no
    values:
      1: "No dithering or halftoning applied (line art)"
      2: "Ordered dither or halftone applied (see CellWidth 264, CellLength 265)"
      3: "Randomized process (e.g. error diffusion) applied"
    defined_in: [T4, T5, T6B]
    notes: Listed as "No Longer Recommended" in 5.0 but restored as baseline in 6.0.

  - code: 264
    name: CellWidth
    since: "4.0"
    last: null
