  - code: 271
    name: Make
    since: "4.0"
    last: null
    status: current
    conformance: baseline
    container: both
    types: [ASCII]
    count: "N"
    default: null
    required: no
    defined_in: [T4, T5, T6B]

  - code: 272
    name: Model
    since: "4.0"
    last: null
    status: current
    conformance: baseline
    container: both
    types: [ASCII]
    count: "N"
    default: null
    required: no
    defined_in: [T4, T5, T6B]

  - code: 273
    name: StripOffsets
    since: "4.0"
    last: null
    status: current
    conformance: baseline
    container: both
    types: [SHORT, LONG]
    bigtiff_types: [LONG8]
    count: "StripsPerImage (PlanarConfiguration=1) | SPP*StripsPerImage (PlanarConfiguration=2)"
    default: null
    required: conditional
    defined_in: [T4, T5, T6B, BTF]
    notes: >
      Required for strip-organized images; mutually exclusive with the tile
      fields (322-325). StripsPerImage = floor((ImageLength + RowsPerStrip -
      1) / RowsPerStrip).

  - code: 274
    name: Orientation
    since: "4.0"
    last: null
    status: current
    conformance: baseline
    container: both
    types: [SHORT]
    count: "1"
    default: 1
    required: no
    values:
      1: "Row 0 top, column 0 left"
      2: "Row 0 top, column 0 right"
      3: "Row 0 bottom, column 0 right"
      4: "Row 0 bottom, column 0 left"
      5: "Row 0 left, column 0 top"
      6: "Row 0 right, column 0 top"
      7: "Row 0 right, column 0 bottom"
      8: "Row 0 left, column 0 bottom"
    defined_in: [T4, T5, T6B]
    notes: Baseline readers are only required to support value 1.

  - code: 277
    name: SamplesPerPixel
    since: "4.0"
    last: null
    status: current
    conformance: baseline
    container: both
    types: [SHORT]
    count: "1"
    default: 1
    required: conditional
    defined_in: [T4, T5, T6B]
    notes: >
      Counts ALL components including extra samples; readers must not derive
      it from PhotometricInterpretation (see DEP rules for 338).

  - code: 278
    name: RowsPerStrip
    since: "4.0"
    last: null
    status: current
    conformance: baseline
    container: both
    types: [SHORT, LONG]
    count: "1"
    default: 4294967295
    required: conditional
    defined_in: [T4, T5, T6B]
    notes: >
      Default 2**32-1 means the whole image is one strip. Recommended target
      is ~8KB per strip (5.0/6.0 guidance). Not used for tiled images.

  - code: 279
    name: StripByteCounts
    since: "4.0"
    last: null
    status: current
    conformance: baseline
    container: both
    types: [SHORT, LONG]
    bigtiff_types: [LONG8]
    count: "StripsPerImage (PlanarConfiguration=1) | SPP*StripsPerImage (PlanarConfiguration=2)"
    default: null
    required: conditional
    type_history:
      - {version: "4.0", types: [LONG]}
      - {version: "5.0", types: [SHORT, LONG]}
    defined_in: [T4, T5, T6B, BTF]
    notes: >
      Required for strip-organized images from 5.0/6.0 (4.0 never states it
      as required - a documented asymmetry; see sources/T4.yaml). Vendor
      deviation: files missing StripByteCounts exist for uncompressed data
      where counts are computable (see constraints.yaml repair actions).

  - code: 280
