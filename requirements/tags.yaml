    required: no
    values:
      1005: "ResolutionInfo structure (0x03ED)"
      1028: "IPTC-NAA record (0x0404) - duplicates tag 33723"
      1039: "Raw ICC profile bytes (0x040F) - duplicates tag 34675"
      1058: "Exif metadata (0x0422) - Photoshop 6 wrote nested Exif here (quirk documented by XMP Part 3)"
      1060: "XMP packet (0x0424) - duplicates tag 700; must NOT be present in TIFF files per XMP Part 3"
      "2000-2997": "Path information / saved paths (0x07D0-0x0BB6), 26-byte path point records"
      2999: "Name of clipping path (0x0BB7)"
    defined_in: [PSFF, XMP]
    notes: >
      Photoshop image resources: a sequence of Image Resource Blocks, each
      "8BIM" signature + 2-byte resource ID + even-padded Pascal-string
      name + 4-byte size + even-padded data (all big-endian regardless of
      TIFF byte order). PSFF states no TIFF type/count; BYTE/UNDEFINED
      reflects practice. XMP Part 3 restricts the tag to the 0th IFD. The
      `values` map lists resource IDs of interchange interest, not TIFF
      tag values; PSFF defines no precedence rule for resources that
      duplicate native TIFF tags.

  - code: 34665
    name: ExifIFDPointer
    since: EXIF
    last: null
    status: current
    conformance: EXIF
    container: both
    location: ifd0
    types: [LONG]
    bigtiff_types: [IFD8]
    count: "1"
    default: null
    required: conditional
    defined_in: [EXIF, PSFF, XMP]
    notes: >
      Offset (from the TIFF header) to the Exif IFD - TIFF IFD structure,
      no image data; resident tags are registered in tags-exif.yaml.
      Mandatory in IFD0 for Exif-compliant files (optional in the
      thumbnail IFD1). Exif 2.3 defines type LONG; BigTIFF containers may
      use IFD8. The pointer is an implicit link (nothing in the type marks
      it as an IFD offset in classic TIFF), so editors must rewrite it
      when relocating the Exif IFD. See DEP-141.

  - code: 34675
    name: ICCProfile
    since: ICC
    last: null
    status: current
    conformance: ICC
    container: both
    location: ifd0
    types: [UNDEFINED]
    count: "N (profile size in bytes)"
    default: null
    required: no
    defined_in: [ICC, PSFF]
    notes: >
      Embedded ICC profile (historically named InterColorProfile). The
      profile is big-endian regardless of TIFF byte order; its 128-byte
      header carries a size field that must equal the tag count and the
      'acsp' signature at offset 36 (see DEP-144/145). ICC.1:2022-05 no
      longer defines the embedding itself - it delegates to ICC Technical
      Note 10-2021 (not vendored; the tag definition here rests on the
      historical Annex B via PSFF and ecosystem practice). A duplicate
      copy commonly exists as Photoshop resource 0x040F inside tag 34377;
      no vendored document states which copy wins.

  - code: 34853
    name: GPSInfoIFDPointer
    since: EXIF
    last: null
    status: current
    conformance: EXIF
    container: both
    location: ifd0
    types: [LONG]
    bigtiff_types: [IFD8]
    count: "1"
    default: null
    required: no
    defined_in: [EXIF, PSFF, XMP]
    notes: >
      Offset (from the TIFF header) to the GPS Info IFD - TIFF IFD
      structure, no image data; resident tags are registered in
      tags-exif.yaml. GPSVersionID (gps-ifd tag 0) is mandatory when the
      GPS IFD is present. Same implicit-link editing caution as 34665.
      See DEP-142.

  - code: 37439
    name: StoNits
    since: LLV
    last: null
    status: current
    conformance: LLV
    container: both
    types: [DOUBLE]
    count: "1"
    default: null
    required: no
    defined_in: [LLV]
    notes: >
      Multiplier converting decoded Y (luminance) sample values to
      absolute luminance in candela/m^2; written when the source data is
      calibrated. The paper states only "a single floating point value";
      DOUBLE is the libtiff-registered type (see sources/LLV.yaml).

  - code: 37724
