# =============================================================================
# Exif tag registry: tags resident in the Exif, GPS and Interoperability IFDs
# =============================================================================
#
# Source: Exif 2.3 (CIPA DC-008-2010) — see sources/EXIF.yaml for per-tag
# section/page citations, and specifications.md for the document registry.
#
# Same field conventions as tags.yaml, plus:
#   location            exif-ifd | gps-ifd | interop-ifd — the IFD the tag
#                       resides in. Tag codes are only unique per location
#                       (e.g. code 1 is GPSLatitudeRef in gps-ifd and
#                       InteroperabilityIndex in interop-ifd).
#   supplement_version  Exif edition that introduced the tag, where the
#                       document states it (bare entries are Exif 2.2-era or
#                       older; this document is the 2.3 edition).
#   description         short semantic summary (the classic registry keeps
#                       this in prose files; Exif tags are numerous enough
#                       that the summary lives here).
#
# The IFD-pointer tags that *reach* these IFDs live in tags.yaml:
#   34665 ExifIFDPointer (IFD0), 34853 GPSInfoIFDPointer (IFD0);
#   40965 InteroperabilityIFDPointer resides in the Exif IFD and is listed
#   here. Placement rules are DEP-140.. in constraints.yaml.
#
# Implied generic rules per entry: TAG-<code>-TYPE/COUNT/VALUE as defined in
# tags.yaml, evaluated against the location-qualified code.
# =============================================================================

tags:
- code: 0
  name: GPSVersionID
  since: EXIF
  last: null
  status: current
  conformance: EXIF
  container: both
  location: gps-ifd
  types:
  - BYTE
  count: '4'
  default: 2.3.0.0
  required: conditional
  values:
    2.3.0.0: Version 2.3
  defined_in:
  - EXIF
  description: >
    Version of the GPS Info IFD; 2.3.0.0 for this standard. Mandatory when the GPS Info IFD
    is present.
  notes: Table 19 lists O, but text says mandatory when GPS Info tag present.
