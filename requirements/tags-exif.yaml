  last: null
  status: current
  conformance: EXIF
  container: both
  location: interop-ifd
  types:
  - ASCII
  count: Any
  default: null
  required: conditional
  values:
    R98: Exif R98 file / DCF basic file
    THM: DCF thumbnail file
    R03: DCF Option File
  defined_in:
  - EXIF
  description: >
    Identification of the interoperability rule (4 bytes incl. NULL). Note: tag code 1 collides
    with GPSLatitudeRef but resides in a different IFD (Interoperability IFD).
  notes: 'In Exif IFD''s Interoperability IFD: N for uncompressed, Optional (O) for compressed.'
