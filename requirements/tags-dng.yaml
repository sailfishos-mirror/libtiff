# =============================================================================
# DNG tag registry: tags defined by the Adobe DNG specification (1.0-1.7.1)
# =============================================================================
#
# Source: DNG 1.7.1.0 — see sources/DNG.yaml for per-tag citations. New values
# DNG defines for classic tags (PhotometricInterpretation 32803/34892/51177/
# 52527, Compression 34892/52546, Predictor 34892-34895, ...) are recorded in
# tags.yaml against the classic entries.
#
# Same field conventions as tags.yaml, plus:
#   location            which IFD role the tag belongs to. DNG assigns tags to
#                       named IFD roles rather than the fixed classic chain:
#                       ifd0 | raw-ifd | preview-ifd | enhanced-ifd |
#                       depth-ifd | semantic-mask-ifd | camera-profile-ifd |
#                       ifd0-or-camera-profile-ifd | jxl-ifd | any-ifd.
#                       (Roles are identified via NewSubfileType and the
#                       SubIFDs tree; see DEP-160.. in constraints.yaml.)
#   supplement_version  DNG version that introduced the tag (e.g. "1.4.0.0").
#   description         short semantic summary.
# =============================================================================

tags:
- code: 50706
  name: DNGVersion
  since: DNG
  last: null
  status: current
  conformance: DNG
  container: both
  location: ifd0
  supplement_version: 1.0.0.0
  types:
  - BYTE
  count: '4'
  default: null
  required: 'yes'
  defined_in:
  - DNG
  description: Four-tier DNG version number of the file. For this spec version the bytes are
    1,7,0,0.
- code: 50707
  name: DNGBackwardVersion
  since: DNG
  last: null
  status: current
  conformance: DNG
  container: both
  location: ifd0
  supplement_version: 1.0.0.0
  types:
  - BYTE
  count: '4'
  default: DNGVersion with the last two bytes set to zero
  required: 'no'
  defined_in:
  - DNG
  description: >
    Oldest DNG spec version with which the file is compatible. Readers must not read files
    whose value exceeds the reader's supported version.
