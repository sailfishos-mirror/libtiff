- code: 50710
  name: CFAPlaneColor
  since: DNG
  last: null
  status: current
  conformance: DNG
  container: both
  location: raw-ifd
  supplement_version: 1.0.0.0
  types:
  - BYTE
  count: ColorPlanes
  default: 0, 1, 2 (red, green, blue)
  required: conditional
  defined_in:
  - DNG
  description: >
    Mapping between CFAPattern values and plane numbers in LinearRaw space. Required for non-RGB
    CFA images.
- code: 50711
  name: CFALayout
  since: DNG
  last: null
  status: current
  conformance: DNG
  container: both
  location: raw-ifd
  supplement_version: 1.0.0.0
  types:
  - SHORT
  count: '1'
  default: 1
  required: 'no'
  values:
    1: Rectangular (or square) layout
    2: 'Staggered layout A: even columns offset down 1/2 row'
    3: 'Staggered layout B: even columns offset up 1/2 row'
    4: 'Staggered layout C: even rows offset right 1/2 column'
    5: 'Staggered layout D: even rows offset left 1/2 column'
    6: 'Staggered layout E: even rows up 1/2 row, even columns left 1/2 column (DNG 1.3.0.0+)'
    7: 'Staggered layout F: even rows up 1/2 row, even columns right 1/2 column (DNG 1.3.0.0+)'
    8: 'Staggered layout G: even rows down 1/2 row, even columns left 1/2 column (DNG 1.3.0.0+)'
    9: 'Staggered layout H: even rows down 1/2 row, even columns right 1/2 column (DNG 1.3.0.0+)'
  defined_in:
  - DNG
  description: Spatial layout of the CFA. Rows/columns numbered from one.
- code: 50712
  name: LinearizationTable
  since: DNG
  last: null
  status: current
  conformance: DNG
  container: both
  location: raw-ifd
  supplement_version: 1.0.0.0
  types:
  - SHORT
  count: N
  default: Identity table (0, 1, 2, 3, ...)
  required: 'no'
  defined_in:
  - DNG
  description: >
    Lookup table mapping stored values to linear values. If SamplesPerPixel != 1, applies
    to all samples. Raw values beyond table size map to last entry.
